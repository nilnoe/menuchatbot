name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  lint:
    name: Swift Format Lint
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          # runner 默认 toolchain 的 `swift` 子命令不含 swift-format
          brew install swift-format
          swift-format lint --recursive --strict Sources Tests

  scale:
    name: Scale Check
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Run scale check
        run: ./scripts/check-scale.sh

  test:
    name: Build & Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  release:
    name: Release Build
    needs: [lint, scale, test]
    # 仅打 tag（v*）时构建可分发的 .app
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Package .app
        run: ./scripts/make-app.sh
      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeek-Chat-${{ github.ref_name }}
          path: dist/DeepSeek Chat.app
          if-no-files-found: error
