[package]
name = "rustcore-fuzz"
version = "0.1.0"
edition = "2021"
publish = false

# 独立 workspace：避免与父包 RustCore 的嵌套包歧义（cargo-fuzz 约定）。
[workspace]

[dependencies]
libfuzzer-sys = "0.4"

[[bin]]
name = "fuzz_eval_expr"
path = "fuzz_targets/fuzz_eval_expr.rs"
test = false
doc = false

[[bin]]
name = "fuzz_index_upsert"
path = "fuzz_targets/fuzz_index_upsert.rs"
test = false
doc = false

[profile.release]
debug = 1
